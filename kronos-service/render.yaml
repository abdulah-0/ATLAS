services:
  - type: web
    name: atlas-kronos
    runtime: python
    rootDir: kronos-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: KRONOS_API_KEY
        generateValue: true
      - key: HF_HOME
        value: /tmp/huggingface
    healthCheckPath: /health
